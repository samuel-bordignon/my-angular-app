<app-dashboard-card image_alt="A list of items" image_url="list.png" title="Support Tickets">
  <div id="traffic">
  <p>Last 7 days</p>

  <div id="chart">
    @for (dataPoint of dummyTrafficData; track dataPoint.id) {
    <div [style.height]="(dataPoint.value / maxTraffic) * 100 + '%'"></div>
    }
  </div>
</div>
</app-dashboard-card>
