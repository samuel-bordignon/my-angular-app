<form (ngSubmit)="onSubmit()" #form>
  <app-control label="Title">
    <input type="text" id="title" name="title" #input [(ngModel)]="enteredTitle">
  </app-control>
  <app-control label="Request">
    <textarea name="" rows="3" #input [(ngModel)]="enteredTitle">
    </textarea>
  </app-control>
  <p>
    <button appButton>
      Submit
      <span ngProjectAs="icon">⌯⌲</span>
    </button>
  </p>
</form>
