<header>
  <h1 class="text-5xl font-extrabold font-syne">{{ title }}</h1>
  <app-user-profile></app-user-profile>
</header>

<div class="grid">

  <div class="card">
    <h2>Contador</h2>
    <app-counter></app-counter>
  </div>

  <div class="card">
    <h2>Configurações</h2>
    <app-settings></app-settings>
  </div>

  <div class="card">
    <h2>Notificação</h2>
    <app-notification [message]="'Atualização disponível'"></app-notification>
  </div>

  <div class="card">
    <h2>Produto</h2>
    <app-product-card></app-product-card>
  </div>

</div>

<div class="mt-6">
  <app-task-list></app-task-list>
</div>

<div class="card mt-6">
  <h2>Bindings dinâmicos</h2>

  <!-- PROBLEMAS INTENCIONAIS -->

  <p [hidden]="false">Este texto deveria esconder no dark mode.</p>

  <button [disabled]="darkMode == false">
    Botão deveria desabilitar quando darkMode for true
  </button>

  <div [style.width]="progress" class="h-2.5 bg-[#2563eb] mt-4"></div>
</div>
