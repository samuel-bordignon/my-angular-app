<div class="flex flex-col gap-2">
  <strong>{{ name }}</strong>

  <!-- PROBLEMA: pipe ausente -->
  <span>{{ price | currency:'BRL':'symbol':'1.2-2':'pt-BR' }}</span>

  <!-- PROBLEMA: cálculo errado -->
  <span class="text-green-600">
    Com desconto: {{ price - (price * discount) | currency:'BRL':'symbol':'1.2-2':'pt-BR' }}
  </span>

  <button>Comprar</button>
</div>
