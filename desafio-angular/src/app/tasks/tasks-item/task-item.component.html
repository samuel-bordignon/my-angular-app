<div class="flex justify-between items-center border-[#e5e7eb] rounded-lg p-3">
  <label class="flex items-center gap-2">
    <!-- PROBLEMA: evento errado -->
    <input type="checkbox" [(ngModel)]="task.done" (change)="taskToggle.emit(task.id)">

    <span [class.done]="task.done">
      {{ task.title }}
    </span>
  </label>

  <!-- PROBLEMA: propriedade errada -->
  <button (click)="remove.emit(task.id)">Remover</button>
</div>
