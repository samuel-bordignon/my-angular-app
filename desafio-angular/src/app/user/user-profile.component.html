<!-- PROBLEMA: src não está com property binding ✓ -->
<div class=" flex items-center gap-4">
  <div class="flex flex-col">
    <Span class="text-2xl">{{ name }}</Span>
    <!-- PROBLEMA: classe invertida ✓ -->
    <span [class.online]="online" [class.offline]="!online">
      {{ online ? 'Online' : 'Offline' }}
    </span>
  </div>
  <img [src]="avatar" (click)="changeAvatar()" class="h-15 rounded-full outline-3 outline-offset-2 outline-ayu-accent">
</div>
