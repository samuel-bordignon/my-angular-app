<app-header></app-header>
<main class="main">
  <ul id="users">
    @for (user of users; track user.id){
      <li>
        <app-user (select)="onSelectUser($event)" [user]="user" [selected]="selectedUserId === user.id"./>
      </li>
    }
  </ul> 
  @if (selectedUser){
    <app-tasks [userName]="selectedUser.name" [userId]="selectedUser.id"/>
  } @else {
    <p id="fallback">Nenhum usuário selecioando</p>
  }
</main>     
<router-outlet />
