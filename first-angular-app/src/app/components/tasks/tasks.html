<section id="tasks">
    <header>
        <h2>Tarefas de {{userName}}</h2>
        <menu>
            <button>Adicionar tarefas</button>
        </menu>
    </header>
    <ul>
        @for (task of selectedTasks; track task.id){
            <li>
                <app-task [task]="task"/>
            </li>
        }
    </ul>
</section>
