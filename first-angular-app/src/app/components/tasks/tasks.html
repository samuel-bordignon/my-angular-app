<section id="tasks">
    <header>
        <h2>Tarefas de {{userName}}</h2>
        <menu>
            <button (click)="onNewTask()">
                Adicionar tarefas
            </button>
        </menu>
    </header>
    <ul>
        @for (task of selectedTasks; track task.id){
        <li>
            <app-task (select)="onCompleteTask($event)" [task]="task" />
        </li>
        }
    </ul>
    @if(newTaskActive){
    <app-new-task />
    }
</section>
