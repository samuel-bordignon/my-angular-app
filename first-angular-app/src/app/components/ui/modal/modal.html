<div class="backdrop" (click)="cancel()"></div>
<dialog open>
    <h2>{{title}}</h2>
    <form (ngSubmit)="submit()">
        <ng-content />
        <p class="actions">
            <button type="button" (click)="cancel()">Cancel</button>
            <button type="submit">Create</button>
        </p>
    </form>
</dialog>
