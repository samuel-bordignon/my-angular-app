<form #f="ngForm" (ngSubmit)="onSubmit(f)">
  <label for="clientName">Nome do cliente</label>
  <input type="text" id="clientName" name="clientName" ngModel required>
  <label for="device">Aparelho</label>
  <input type="text" id="device" name="device" ngModel required>
  <label for="issueDescription">Descrição do problema</label>
  <textarea id="issueDescription" name="issueDescription" rows="3" ngModel required></textarea>
  <button type="submit">Cadastrar</button>
  <label for="price">Valor Atendimento</label>
  <input type="number" id="price" name="price" ngModel required>
  <label for="priority">Valor Atendimento</label>
  <select id="priority" name="priority" ngModel required>
</form>
